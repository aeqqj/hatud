services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campusgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusgo
      POSTGRES_PASSWORD: campusgo_dev_pw
      POSTGRES_DB: campusgo_dev
    ports:
      - "5432:5432"
    volumes:
      - campusgo_pgdata:/var/lib/postgresql/data

volumes:
  campusgo_pgdata:
